<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CineSnack — สั่งล่วงหน้า รับที่เคาน์เตอร์</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --blue:#2563EB; --blue-d:#1D4ED8; --bg:#F5F7FB; --ink:#0F172A; --muted:#64748B; --line:#E5E9F0; --yellow:#FACC15; --green:#16A34A; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sukhumvit Set","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;color:var(--blue);font-size:18px;letter-spacing:-.3px}
  .branch{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
  .cartbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .promo{margin:14px 16px;background:#EAF1FF;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px}
  .promo h3{font-size:15px;color:var(--blue-d);line-height:1.4}
  .promo p{font-size:12px;color:#3B6BD6;margin-top:2px}
  .promo .ic{font-size:34px;margin-left:auto}
  .tabs{position:sticky;top:65px;z-index:15;background:var(--bg);display:flex;gap:18px;padding:10px 16px 6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-size:14px;color:var(--muted);white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
  .tab.on{color:var(--ink);border-color:var(--blue);font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 130px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .card .imgwrap{position:relative;aspect-ratio:4/3;background:#EFF4FF}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .best{position:absolute;top:8px;left:8px;background:var(--yellow);color:#7A5B00;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}
  .add{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(37,99,235,.4);cursor:pointer}
  .card .body{padding:10px 12px 12px}
  .card .nm{font-size:14px;font-weight:600;line-height:1.3}
  .card .ds{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;min-height:14px}
  .card .pr{font-size:16px;font-weight:800;margin-top:8px}
  .pr small{font-size:12px;font-weight:600;color:var(--muted)}
  /* bottom CTA */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:25;max-width:480px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:none}
  .cta.show{display:block}
  .cta button{width:100%;height:52px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
  .cta .cnt{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;font-size:13px}
  /* sheet / overlay */
  .ov{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;background:#D8DEE9;border-radius:2px;margin:10px auto 4px}
  .sheet .hd{padding:6px 18px 12px;border-bottom:1px solid var(--line)}
  .sheet .hd h2{font-size:18px}
  .sheet .pad{padding:16px 18px}
  .opt{margin-bottom:16px}
  .opt .lab{font-size:13px;font-weight:700;margin-bottom:8px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
  .chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue-d);font-weight:600}
  .qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
  .stepper span{font-size:18px;font-weight:700;min-width:20px;text-align:center}
  .sheetcta{position:sticky;bottom:0;background:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sheetcta button{width:100%;height:52px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  /* cart rows */
  .crow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .crow .ci{flex:1}
  .crow .nm{font-size:14px;font-weight:600}
  .crow .op{font-size:12px;color:var(--muted);margin-top:2px}
  .crow .lp{font-weight:700;font-size:14px;white-space:nowrap}
  .ministep{display:flex;align-items:center;gap:10px;margin-top:6px}
  .ministep button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
  .sumline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:4px 0}
  .sumline.total{color:var(--ink);font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;resize:none;margin-top:8px}
  /* payment */
  .qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
  .qrbox .ppl{display:flex;align-items:center;justify-content:center;gap:8px;color:#0B4DA8;font-weight:700;margin-bottom:14px}
  #qr{display:inline-block;padding:10px;background:#fff;border-radius:12px}
  #qr img,#qr canvas{display:block}
  .amt{font-size:30px;font-weight:800;margin-top:14px}
  .upl{display:block;margin:16px;border:2px dashed #C7D2FE;border-radius:16px;padding:22px;text-align:center;color:var(--blue-d);font-weight:600;cursor:pointer;background:#F8FAFF}
  .upl.done{border-style:solid;border-color:var(--green);color:var(--green);background:#F0FDF4}
  #slipPrev{max-width:100%;border-radius:12px;margin-top:10px;display:none}
  .notice{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.6;margin:16px}
  /* tracking */
  .track{padding:24px 18px 40px;text-align:center}
  .tickbig{width:76px;height:76px;border-radius:50%;background:#EAF1FF;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:40px;margin:8px auto 14px}
  .qno{font-size:34px;font-weight:800;letter-spacing:1px;margin:4px 0}
  .steps{display:flex;flex-direction:column;gap:0;margin:22px auto;max-width:300px;text-align:left}
  .st{display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
  .st .dot{width:24px;height:24px;border-radius:50%;background:#E2E8F0;color:#94A3B8;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
  .st.on .dot{background:var(--blue);color:#fff}
  .st.done .dot{background:var(--green);color:#fff}
  .st .tx{font-size:15px;color:var(--muted);font-weight:500}
  .st.on .tx,.st.done .tx{color:var(--ink);font-weight:700}
  .hidden{display:none!important}
  .setupwarn{margin:40px 16px;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:14px;padding:18px;font-size:14px;line-height:1.7}
  .setupwarn code{background:#fff;padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo">CineSnack</span>
    <span class="branch" id="branchName"></span>
    <button class="cartbtn" id="openCart">🛒<span class="badge hidden" id="cartBadge">0</span></button>
  </div>

  <!-- MENU VIEW -->

      </div>
      <span class="ic">🍿</span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- PAYMENT VIEW -->
  <div id="payView" class="hidden">
    <div class="qrbox" style="margin:16px">
      <div class="ppl">⬛ พร้อมเพย์ · PromptPay</div>
      <div id="qr"></div>
      <div class="amt" id="payAmt">฿0</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">สแกนด้วยแอปธนาคารเพื่อโอน</div>
    </div>
    <label class="upl" id="uplLabel" for="slipFile">📎 แตะเพื่อแนบสลิปการโอน<br><span style="font-size:12px;font-weight:400">(บังคับ เพื่อให้เคาน์เตอร์ยืนยัน)</span></label>
    <input type="file" id="slipFile" accept="image/*" class="hidden">
    <img id="slipPrev">
    <div class="notice">หลังแนบสลิปและกดส่งออเดอร์ เคาน์เตอร์จะตรวจสลิปแล้วเริ่มจัดให้ — คุณดูสถานะได้ในหน้าถัดไป สามารถแคปหน้าจอเลขคิวไว้ได้</div>
  </div>

  <!-- TRACKING VIEW -->
  <div id="trackView" class="hidden">
    <div class="track">
      <div class="tickbig" id="trackIcon">✓</div>
      <div style="font-size:14px;color:var(--muted)">หมายเลขคิวของคุณ</div>
      <div class="qno" id="trackNo">#0000</div>
      <div style="font-size:13px;color:var(--muted)" id="trackBranch"></div>
      <div class="steps" id="trackSteps"></div>
      <div id="trackMsg" style="font-size:14px;color:var(--muted);margin-top:8px"></div>
      <button onclick="location.reload()" style="margin-top:24px;height:48px;padding:0 24px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer">สั่งออเดอร์ใหม่</button>
    </div>
  </div>

  <div id="setupWarn"></div>
</div>

<!-- bottom CTA -->
<div class="cta" id="cta">
  <button id="ctaBtn"><span class="cnt" id="ctaCnt">0 ชิ้น</span><span id="ctaLabel">ดูตะกร้า</span><span style="margin-left:auto;font-weight:800" id="ctaTotal">฿0</span></button>
</div>

<!-- option sheet -->
<div class="ov" id="optOv">
  <div class="sheet">
    <div class="grab"></div>
    <div class="hd"><h2 id="optName"></h2></div>
    <div class="pad" id="optBody"></div>
    <div class="sheetcta"><button id="optAdd">ใส่ตะกร้า · ฿0</button></div>
  </div>
</div>

<!-- cart sheet -->
<div class="ov" id="cartOv">
  <div class="sheet">
    <div class="grab"></div>
    <div class="hd"><h2>ตะกร้าของคุณ</h2></div>
    <div class="pad" id="cartBody"></div>
    <div class="sheetcta"><button id="goPay">ไปชำระเงิน · ฿0</button></div>
  </div>
</div>

/* ---------- PromptPay payload (EMVCo) ---------- */
function f(id,v){ return id + String(v.length).padStart(2,"0") + v; }
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++){ c = (c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } } return c.toString(16).toUpperCase().padStart(4,"0"); }
function promptpayPayload(id, amount){
  id = (id||"").replace(/[^0-9]/g,"");
  let acc;
  if(id.length>=13){ acc = f("00","A000000677010111") + f("02", id); }       // national/tax id
  else { acc = f("00","A000000677010111") + f("01", "0066"+id.replace(/^0/,"")); } // phone
  let p = f("00","01") + f("01", amount? "12":"11") + f("29", acc) + f("53","764");
  if(amount) p += f("54", Number(amount).toFixed(2));
  p += f("58","TH");
  p += "6304" + crc16(p+"6304");
  return p;
}

  if(firebaseConfig.apiKey.startsWith("PASTE")){
    document.getElementById("setupWarn").innerHTML =
      `<div class="setupwarn"><b>ยังไม่ได้ตั้งค่า Firebase</b><br>เปิดไฟล์ <code>index.html</code> แล้ววาง <code>firebaseConfig</code> + เบอร์พร้อมเพย์ในส่วน "ตั้งค่าตรงนี้" ตามคู่มือก่อนใช้งานจริง (เมนูยังกดดูได้ปกติ)</div>`;
    return false;
  }
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  return true;
}

/* ---------- option sheet ---------- */
const optOv=document.getElementById("optOv");
let optState=null;
function openOption(p){
  const opts=p.options||[];
  const sel=opts.map(()=>0);
  optState={p,sel,qty:1};
  document.getElementById("optName").textContent=p.name;
  document.getElementById("optBody").innerHTML =
    opts.map((o,oi)=>`<div class="opt"><div class="lab">${o.lab}</div><div class="choices">${
      o.choices.map((c,ci)=>`<div class="chip${ci===0?' on':''}" data-o="${oi}" data-c="${ci}">${c.l}${c.a?` +${c.a}`:''}</div>`).join("")
    }</div></div>`).join("") +
    `<div class="opt"><div class="lab">จำนวน</div><div class="qtyrow"><span style="font-size:13px;color:var(--muted)">เลือกจำนวน</span>
      <div class="stepper"><button id="qd">−</button><span id="qv">1</span><button id="qu">+</button></div></div></div>`;
  optOv.classList.add("show");
  updOptCta();
  document.getElementById("optBody").querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const oi=+ch.dataset.o, ci=+ch.dataset.c; optState.sel[oi]=ci;
    document.getElementById("optBody").querySelectorAll(`.chip[data-o="${oi}"]`).forEach(x=>x.classList.toggle("on",+x.dataset.c===ci));
    updOptCta();
  });
  document.getElementById("qd").onclick=()=>{optState.qty=Math.max(1,optState.qty-1);document.getElementById("qv").textContent=optState.qty;updOptCta();};
  document.getElementById("qu").onclick=()=>{optState.qty++;document.getElementById("qv").textContent=optState.qty;updOptCta();};
}
function optUnit(){ const {p,sel}=optState; let u=p.price; (p.options||[]).forEach((o,oi)=>u+=o.choices[sel[oi]].a); return u; }
function updOptCta(){ document.getElementById("optAdd").textContent=`ใส่ตะกร้า · ${baht(optUnit()*optState.qty)}`; }
document.getElementById("optAdd").onclick=()=>{
  const {p,sel,qty}=optState;
  const label=(p.options||[]).map((o,oi)=>o.choices[sel[oi]].l).join(" · ");
  const key=p.id+"|"+label, unit=optUnit();
  const ex=cart.find(i=>i.key===key);
  if(ex) ex.qty+=qty; else cart.push({key,id:p.id,name:p.name,optLabel:label,unit,qty});
  optOv.classList.remove("show"); syncCta();
};
optOv.onclick=e=>{ if(e.target===optOv) optOv.classList.remove("show"); };

/* ---------- cart cta ---------- */
const cta=document.getElementById("cta");
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}
function cartTotal(){return cart.reduce((s,i)=>s+i.unit*i.qty,0);}
function syncCta(){
  const n=cartCount();
  document.getElementById("cartBadge").classList.toggle("hidden",n===0);
  document.getElementById("cartBadge").textContent=n;
  cta.classList.toggle("show",n>0);
  document.getElementById("ctaCnt").textContent=n+" ชิ้น";
  document.getElementById("ctaTotal").textContent=baht(cartTotal());
}

/* ---------- cart sheet ---------- */

function openCart(){ renderCart(); cartOv.classList.add("show"); }

function renderCart(){
  const body=document.getElementById("cartBody");
  if(!cart.length){ body.innerHTML='<p style="color:var(--muted);padding:20px 0;text-align:center">ยังไม่มีสินค้า</p>'; document.getElementById("goPay").textContent="ไปชำระเงิน"; return; }
  body.innerHTML = cart.map((i,idx)=>`
    <div class="crow">
      <div class="ci">
        <div class="nm">${i.name}</div>
        ${i.optLabel?`<div class="op">${i.optLabel}</div>`:''}
        <div class="ministep"><button data-d="${idx}">−</button><span>${i.qty}</span><button data-u="${idx}">+</button></div>
      </div>
      <div class="lp">${baht(i.unit*i.qty)}</div>
    </div>`).join("") +
    `<div style="padding-top:14px">
      <div class="sumline"><span>ยอดสินค้า</span><span>${baht(cartTotal())}</span></div>
      <div class="sumline total"><span>รวมทั้งหมด</span><span>${baht(cartTotal())}</span></div>
    </div>`;
  body.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{cart[+b.dataset.u].qty++;renderCart();syncCta();});
  body.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);renderCart();syncCta();});
  document.getElementById("goPay").textContent=`ไปชำระเงิน · ${baht(cartTotal())}`;
}
document.getElementById("goPay").onclick=()=>{ if(cart.length) showPay(); };

/* ---------- payment ---------- */
let slipData=null;
function showPay(){
  cartOv.classList.remove("show"); cta.classList.remove("show");
  document.getElementById("menuView").classList.add("hidden");
  document.getElementById("payView").classList.remove("hidden");
  tabsEl.style.display="none";
  const total=cartTotal();
  document.getElementById("payAmt").textContent=baht(total);
  document.getElementById("qr").innerHTML="";
  new QRCode(document.getElementById("qr"),{text:promptpayPayload(SHOP.promptpayId,total),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  window.scrollTo(0,0);
}
const slipFile=document.getElementById("slipFile");
// เปิดหน้าต่างเลือกไฟล์ผ่าน <label for="slipFile"> อยู่แล้ว — ไม่ต้องสั่ง .click() ซ้ำ (กันเด้งซ้อน 2 รอบบนมือถือ)
slipFile.onchange=()=>{
  const file=slipFile.files[0]; if(!file) return;
  const img=new Image(); const rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas"); cv.width=img.width*sc; cv.height=img.height*sc;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    slipData=cv.toDataURL("image/jpeg",0.6);
    const prev=document.getElementById("slipPrev"); prev.src=slipData; prev.style.display="block";
    document.getElementById("uplLabel").classList.add("done");
    document.getElementById("uplLabel").innerHTML="✓ แนบสลิปแล้ว · แตะเพื่อเปลี่ยน";
    showSubmit();
  }; img.src=rd.result; };
  rd.readAsDataURL(file);
};
function showSubmit(){
  if(document.getElementById("submitBar")) return;
  const bar=document.createElement("div"); bar.className="cta show"; bar.id="submitBar";
  bar.innerHTML='<button id="submitOrder">ส่งออเดอร์ให้เคาน์เตอร์</button>';
  document.body.appendChild(bar);
  document.getElementById("submitOrder").onclick=submitOrder;
}
let submitting=false;
const QUEUE_MAX = 100;   // เลขคิววนกลับเมื่อถึงเลขนี้ (1..QUEUE_MAX)
async function nextQueue(){
  const cref = doc(db,"counters","queue");
  return await runTransaction(db, async tx=>{
    const snap = await tx.get(cref);
    const cur = snap.exists() ? (snap.data().n||0) : 0;
    const next = (cur % QUEUE_MAX) + 1;     // 1,2,...,100,1,2,...
    tx.set(cref, {n: next}, {merge:true});
    return next;
  });
}
async function submitOrder(){
  if(submitting) return;
  if(!slipData){ alert("กรุณาแนบสลิปก่อน"); return; }
  if(!ready){ alert("ยังไม่ได้เชื่อม Firebase — ดูคู่มือตั้งค่าก่อน"); return; }
  submitting=true;
  const btn=document.getElementById("submitOrder"); btn.textContent="กำลังส่ง..."; btn.disabled=true;
  try{
    const orderNo = String(await nextQueue());   // เลขคิวรัน 1-100 แล้ววนใหม่ (atomic กันซ้ำ)
    const ref=await addDoc(collection(db,"orders"),{
      orderNo, branch:SHOP.branch,
      items:cart.map(i=>({name:i.name,optLabel:i.optLabel,unit:i.unit,qty:i.qty})),
      total:cartTotal(), slip:slipData, status:"new", createdAt:serverTimestamp()
    });
    document.getElementById("submitBar").remove();
    trackOrder(ref.id, orderNo);
  }catch(err){ alert("ส่งไม่สำเร็จ: "+err.message); btn.textContent="ลองอีกครั้ง"; btn.disabled=false; submitting=false; }
}

/* ---------- tracking ---------- */
const STEPS=[
  {k:"new", t:"ส่งออเดอร์ + รอยืนยันสลิป"},
  {k:"confirmed", t:"ยืนยันแล้ว · กำลังจัด"},
  {k:"ready", t:"พร้อมรับที่เคาน์เตอร์"},
  {k:"done", t:"รับของเรียบร้อย"}
];
const ORDERIDX={new:0,confirmed:1,ready:2,done:3,rejected:-1};
function trackOrder(id, orderNo){
  document.getElementById("payView").classList.add("hidden");
  document.getElementById("trackView").classList.remove("hidden");
  document.getElementById("trackNo").textContent="#"+orderNo;
  document.getElementById("trackBranch").textContent=SHOP.name+" · "+SHOP.branch;
  renderSteps("new");
  onSnapshot(doc(db,"orders",id),snap=>{
    const st=snap.data()?.status||"new"; renderSteps(st);
    const msg=document.getElementById("trackMsg"), icon=document.getElementById("trackIcon");
    if(st==="rejected"){ icon.textContent="!"; icon.style.background="#FEE2E2"; icon.style.color="#DC2626"; msg.textContent="สลิปไม่ผ่านการตรวจสอบ กรุณาติดต่อเคาน์เตอร์"; }
    else if(st==="ready"){ icon.textContent="🛎️"; msg.textContent="ออเดอร์พร้อมแล้ว! แสดงหน้านี้ที่เคาน์เตอร์เพื่อรับของ"; }
    else if(st==="done"){ icon.textContent="✓"; icon.style.background="#DCFCE7"; icon.style.color="#16A34A"; msg.textContent="ขอบคุณที่ใช้บริการ 🎬"; }
    else if(st==="confirmed"){ msg.textContent="เคาน์เตอร์กำลังจัดออเดอร์ให้คุณ"; }
    else { msg.textContent="กำลังรอเคาน์เตอร์ตรวจสลิป..."; }
  });
}
function renderSteps(status){
  const idx=ORDERIDX[status];
  document.getElementById("trackSteps").innerHTML = STEPS.map((s,i)=>{
    let cls=""; if(status!=="rejected"){ if(i<idx)cls="done"; else if(i===idx)cls="on"; }
    return `<div class="st ${cls}"><div class="dot">${i<idx?'✓':i+1}</div><div class="tx">${s.t}</div></div>`;
  }).join("");
}

/* ---------- boot ---------- */
ready = initFirebase();
syncCta();
