<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineSnack — จอแสดงคิว</title>
<style>
  :root{ --blue:#2563EB; --bg:#0B1220; --panel:#111C30; --line:#1E2A44; --green:#22C55E; --amber:#F59E0B; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sukhumvit Set","Noto Sans Thai",sans-serif;background:var(--bg);color:#fff;overflow:hidden}
  .screen{height:100vh;display:flex;flex-direction:column}
  /* header */
  .hd{display:flex;align-items:center;gap:14px;padding:2.2vh 3vw;border-bottom:1px solid var(--line);background:var(--panel)}
  .hd .lg{font-weight:800;font-size:clamp(20px,3vw,34px);color:#fff}
  .hd .lg b{color:#5B8DEF}
  .hd .sub{font-size:clamp(12px,1.5vw,18px);color:#7E8CA8}
  .hd .clock{margin-left:auto;font-size:clamp(18px,2.6vw,30px);font-weight:700;font-variant-numeric:tabular-nums}
  .hd .live{font-size:clamp(11px,1.3vw,15px);color:#4ADE80;display:flex;align-items:center;gap:6px}
  .hd .live::before{content:"";width:9px;height:9px;border-radius:50%;background:#4ADE80}
  /* queue area */
  .queue{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0}
  .col+.col{border-left:1px solid var(--line)}
  .colhd{text-align:center;padding:1.6vh 0;font-weight:800;font-size:clamp(18px,2.8vw,32px);letter-spacing:.5px}
  .col.prog .colhd{background:#15233D;color:#9DB8F0}
  .col.done .colhd{background:#0E2A1B;color:#5EE9A0}
  .tiles{flex:1;overflow-y:auto;padding:2vh 2vw;display:flex;flex-wrap:wrap;gap:1.6vh 1.6vw;align-content:flex-start;justify-content:center}
  .tiles::-webkit-scrollbar{display:none}
  .tile{min-width:clamp(90px,13vw,180px);text-align:center;padding:1.4vh 1.4vw;border-radius:16px;font-weight:800;font-size:clamp(34px,6.5vw,86px);font-variant-numeric:tabular-nums;line-height:1}
  .col.prog .tile{background:#1B2A48;color:#C7D6F5}
  .col.done .tile{background:var(--green);color:#04250F}
  .tile.flash{animation:pop 1s ease 3}
  @keyframes pop{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(34,197,94,0)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(34,197,94,.35)}}
  .empty{color:#39445f;font-size:clamp(14px,2vw,22px);margin:auto;text-align:center}
  /* ad area */
  .ads{height:32vh;position:relative;background:#000;border-top:1px solid var(--line);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:center;justify-content:center}
  .slide.on{opacity:1}
  .slide img{width:100%;height:100%;object-fit:cover}
  .slide.ph{flex-direction:column;gap:1.5vh;color:#fff}
  .slide.ph .big{font-size:clamp(28px,5vw,64px);font-weight:800}
  .slide.ph .small{font-size:clamp(14px,2.2vw,26px);opacity:.9}
  .dots{position:absolute;bottom:1.4vh;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:2}
  .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
  .dots i.on{background:#fff;width:22px;border-radius:5px}
  /* start overlay */
  .start{position:fixed;inset:0;background:#0B1220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;cursor:pointer;text-align:center;padding:20px}
  .start .t{font-size:clamp(22px,4vw,40px);font-weight:800}
  .start .d{font-size:clamp(14px,2vw,22px);color:#8fa0c2}
  .start .b{margin-top:10px;padding:16px 34px;background:var(--blue);border-radius:14px;font-size:clamp(16px,2vw,22px);font-weight:700}
  .setup{margin:auto;max-width:560px;background:#111C30;border:1px solid #1E2A44;border-radius:14px;padding:24px;color:#E2E8F0;line-height:1.7;font-size:16px}
  .setup code{background:#0B1220;padding:1px 6px;border-radius:5px;color:#93C5FD}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="hd">
    <div>
      <div class="lg">Cine<b>Snack</b></div>
      <div class="sub">คิวรับสินค้า · แสดงเลขคิวเมื่อพร้อมรับ</div>
    </div>
    <div style="margin-left:auto;text-align:right">
      <div class="clock" id="clock">--:--</div>
      <div class="live">LIVE</div>
    </div>
  </div>

  <div class="queue" id="queue">
    <div class="col prog">
      <div class="colhd">🍳 กำลังทำ</div>
      <div class="tiles" id="tProg"></div>
    </div>
    <div class="col done">
      <div class="colhd">✅ พร้อมรับแล้ว</div>
      <div class="tiles" id="tDone"></div>
    </div>
  </div>

  <div class="ads" id="ads"></div>
</div>

<div class="start" id="start">
  <div class="t">CineSnack — จอแสดงคิว</div>
  <div class="d">แตะหน้าจอเพื่อเริ่ม (เปิดเสียงเรียกคิว + เต็มจอ)</div>
  <div class="b">แตะเพื่อเริ่ม ▶</div>
</div>

<div id="setupHost"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ═══════════════ ตั้งค่า ═══════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBCjzGpHTk4WrEB5Fdi9u5124_DGHiu-PM",
  authDomain: "cinesnack-f7aef.firebaseapp.com",
  projectId: "cinesnack-f7aef",
  storageBucket: "cinesnack-f7aef.firebasestorage.app",
  messagingSenderId: "903716246233",
  appId: "1:903716246233:web:49691e460517f3986f64c8"
};

/* 📢 โฆษณา: ใส่ path รูปโปรฯ ที่นี่ (เว้นว่างไว้ = ใช้สไลด์ตัวอย่าง)
   เช่น: const ADS = ["img/ads/promo1.jpg", "img/ads/promo2.jpg"]; */
const ADS = [];
const AD_INTERVAL = 7000;   // เปลี่ยนสไลด์ทุกกี่มิลลิวินาที
/* ═══════════════════════════════════════ */

/* clock */
function tick(){ const d=new Date(); document.getElementById("clock").textContent =
  String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
tick(); setInterval(tick, 15000);

/* ad carousel */
(function buildAds(){
  const host=document.getElementById("ads");
  const defaults=[
    {bg:"#1D4ED8", big:"สั่งล่วงหน้า ไม่ต้องต่อคิว", small:"สแกน QR ที่โต๊ะ สั่งแล้วรับที่เคาน์เตอร์ได้เลย"},
    {bg:"#7C3AED", big:"เซ็ตคู่จิ้น ฿320", small:"ป๊อปคอร์นใหญ่ + น้ำ 2 แก้ว ดูหนังฟินครบ"},
    {bg:"#0F766E", big:"ป๊อปคอร์นเนยทอง", small:"หอมเนยสด กรอบทุกเม็ด เริ่มต้น ฿120"}
  ];
  let slides;
  if(ADS.length){ slides = ADS.map(src=>`<div class="slide"><img src="${src}" alt=""></div>`); }
  else { slides = defaults.map(d=>`<div class="slide ph" style="background:${d.bg}"><div class="big">${d.big}</div><div class="small">${d.small}</div></div>`); }
  host.innerHTML = slides.join("") +
    '<div class="dots">'+slides.map(()=>'<i></i>').join("")+'</div>';
  const els=[...host.querySelectorAll(".slide")], dots=[...host.querySelectorAll(".dots i")];
  let i=0; els[0].classList.add("on"); dots[0].classList.add("on");
  if(els.length>1) setInterval(()=>{
    els[i].classList.remove("on"); dots[i].classList.remove("on");
    i=(i+1)%els.length;
    els[i].classList.add("on"); dots[i].classList.add("on");
  }, AD_INTERVAL);
})();

/* start overlay → fullscreen + audio unlock */
let actx=null;
document.getElementById("start").onclick=()=>{
  document.getElementById("start").style.display="none";   // ซ่อนก่อนเสมอ
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch(e){}
  try{ const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen(); }catch(e){}
};
function chime(){
  if(!actx) return;
  [[880,0],[1175,0.16]].forEach(([f,t])=>{ const o=actx.createOscillator(),g=actx.createGain();
    o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    const s=actx.currentTime+t; g.gain.setValueAtTime(0.001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,s+0.5); o.start(s); o.stop(s+0.52); });
}

/* firebase */
if(firebaseConfig.apiKey.startsWith("PASTE")){
  document.getElementById("screen").style.display="none";
  document.getElementById("start").style.display="none";
  document.getElementById("setupHost").innerHTML='<div class="setup"><b>ยังไม่ได้ตั้งค่า Firebase</b> — วาง firebaseConfig ชุดเดียวกับไฟล์อื่นก่อน</div>';
}else{
  const db=getFirestore(initializeApp(firebaseConfig));
  const tProg=document.getElementById("tProg"), tDone=document.getElementById("tDone");
  let firstDone=true; const seenDone=new Set();

  onSnapshot(query(collection(db,"orders"),orderBy("createdAt","asc")),snap=>{
    const prog=[], done=[]; const doneIds=[];
    snap.forEach(d=>{ const o=d.data();
      if(o.status==="confirmed") prog.push(o.orderNo);
      else if(o.status==="ready"){ done.push({no:o.orderNo, id:d.id}); doneIds.push(d.id); }
    });
    const newReady = done.filter(x=>!seenDone.has(x.id));
    tProg.innerHTML = prog.length ? prog.map(n=>`<div class="tile">#${n}</div>`).join("") : '<div class="empty">— ไม่มีคิวกำลังทำ —</div>';
    tDone.innerHTML = done.length ? done.map(x=>`<div class="tile${(!firstDone && !seenDone.has(x.id))?' flash':''}">#${x.no}</div>`).join("") : '<div class="empty">— รอเรียกคิว —</div>';
    if(!firstDone && newReady.length){ chime(); }
    done.forEach(x=>seenDone.add(x.id));
    firstDone=false;
  });
}
</script>
</body>
</html>
