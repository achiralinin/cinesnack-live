<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineSnack — เคาน์เตอร์ (KDS)</title>
<style>
  :root{ --blue:#2563EB; --bg:#0F172A; --panel:#1E293B; --card:#fff; --ink:#0F172A; --muted:#64748B; --line:#E5E9F0; --green:#16A34A; --amber:#F59E0B; --red:#DC2626; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sukhumvit Set","Noto Sans Thai",sans-serif;background:var(--bg);color:#E2E8F0;height:100vh;overflow:hidden}
  .bar{height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0B1220;border-bottom:1px solid #1E293B}
  .bar .lg{font-weight:800;color:#fff;font-size:18px}
  .bar .br{font-size:13px;color:#94A3B8}
  .bar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:12px;padding:5px 10px;border-radius:999px;background:#1E293B;color:#94A3B8}
  .pill.live{background:#052E16;color:#4ADE80}
  .soundbtn{font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid #334155;background:#1E293B;color:#E2E8F0;cursor:pointer;font-weight:600}
  .soundbtn.on{background:#052E16;border-color:#166534;color:#4ADE80}
  .board{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;height:calc(100vh - 60px)}
  .lane{border-right:1px solid #1E293B;display:flex;flex-direction:column;min-height:0}
  .lane:last-child{border-right:none}
  .lhead{padding:12px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid #1E293B}
  .lhead .n{margin-left:auto;background:#334155;color:#fff;border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 7px}
  .lhead.new .n{background:var(--blue)}
  .lhead.cook .n{background:var(--amber)}
  .lhead.ready .n{background:var(--green)}
  .lhead.pos .n{background:#7C3AED}
  .lbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
  .o{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;border-left:5px solid var(--blue)}
  .o.cook{border-left-color:var(--amber)}
  .o.ready{border-left-color:var(--green)}
  .o.pos{border-left-color:#7C3AED}
  .o.flash{animation:flash 1s ease 3}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}50%{box-shadow:0 0 0 4px rgba(37,99,235,.5)}}
  .o .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .o .no{font-size:22px;font-weight:800;letter-spacing:.5px}
  .o .tm{margin-left:auto;font-size:12px;color:var(--muted)}
  .o .it{font-size:14px;padding:3px 0;display:flex;gap:8px}
  .o .it .q{font-weight:800;color:var(--blue);min-width:26px}
  .o .it .op{color:var(--muted);font-size:12px}
  .o .tot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800;font-size:15px}
  .o .acts{display:flex;gap:8px;margin-top:12px}
  .o button{flex:1;height:44px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .b-slip{background:#EEF2FF;color:#3730A3;flex:0 0 52px!important}
  .b-go{background:var(--blue);color:#fff}
  .b-cook{background:var(--amber);color:#fff}
  .b-ready{background:var(--green);color:#fff}
  .b-done{background:#334155;color:#fff}
  .b-pos{background:#7C3AED;color:#fff}
  .b-rej{background:#FEE2E2;color:#B91C1C;flex:0 0 52px!important}
  .empty{color:#475569;text-align:center;font-size:13px;padding:30px 0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal img{max-width:100%;max-height:80vh;border-radius:12px}
  .modal .x{position:absolute;top:20px;right:24px;color:#fff;font-size:34px;cursor:pointer}
  .setup{margin:40px auto;max-width:560px;background:#1E293B;border:1px solid #334155;border-radius:14px;padding:24px;color:#E2E8F0;line-height:1.7}
  .setup code{background:#0B1220;padding:1px 6px;border-radius:5px;color:#93C5FD}
</style>
</head>
<body>
<div class="bar">
  <span class="lg">CineSnack</span>
  <span class="br" id="brName">เคาน์เตอร์</span>
  <div class="sp">
    <span class="pill live" id="livePill">● เชื่อมต่อแล้ว</span>
    <button class="soundbtn" id="soundBtn">🔔 เปิดเสียงเตือน</button>
  </div>
</div>

<div class="board" id="board">
  <div class="lane">
    <div class="lhead new">🆕 ออเดอร์ใหม่ (รอยืนยันสลิป)<span class="n" id="cNew">0</span></div>
    <div class="lbody" id="laneNew"></div>
  </div>
  <div class="lane">
    <div class="lhead cook">👨‍🍳 กำลังจัด<span class="n" id="cCook">0</span></div>
    <div class="lbody" id="laneCook"></div>
  </div>
  <div class="lane">
    <div class="lhead ready">🛎️ พร้อมรับ<span class="n" id="cReady">0</span></div>
    <div class="lbody" id="laneReady"></div>
  </div>
  <div class="lane">
    <div class="lhead pos">🧾 รอลง POS<span class="n" id="cPos">0</span></div>
    <div class="lbody" id="lanePos"></div>
  </div>
</div>

<div id="setupHost"></div>

<div class="modal" id="slipModal"><span class="x" id="slipX">×</span><img id="slipImg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ═══ ใช้ค่าเดียวกับ index.html ═══ */
const firebaseConfig = {
  apiKey: "AIzaSyBCjzGpHTk4WrEB5Fdi9u5124_DGHiu-PM",
  authDomain: "cinesnack-f7aef.firebaseapp.com",
  projectId: "cinesnack-f7aef",
  storageBucket: "cinesnack-f7aef.firebasestorage.app",
  messagingSenderId: "903716246233",
  appId: "1:903716246233:web:49691e460517f3986f64c8"
};
/* ═════════════════════════════════ */

if(firebaseConfig.apiKey.startsWith("PASTE")){
  document.getElementById("board").style.display="none";
  document.getElementById("setupHost").innerHTML=
    `<div class="setup"><b>ยังไม่ได้ตั้งค่า Firebase</b><br>วาง <code>firebaseConfig</code> ชุดเดียวกับ <code>index.html</code> ในไฟล์ <code>counter.html</code> ก่อนใช้งาน</div>`;
  document.getElementById("livePill").textContent="● ยังไม่เชื่อม";
  document.getElementById("livePill").className="pill";
}else{
  const db=getFirestore(initializeApp(firebaseConfig));
  const baht=n=>"฿"+Number(n).toLocaleString();
  const elNew=document.getElementById("laneNew"), elCook=document.getElementById("laneCook"), elReady=document.getElementById("laneReady"), elPos=document.getElementById("lanePos");

  /* sound unlock */
  let actx=null, soundOn=false;
  document.getElementById("soundBtn").onclick=()=>{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    soundOn=!soundOn;
    const b=document.getElementById("soundBtn");
    b.classList.toggle("on",soundOn);
    b.textContent= soundOn? "🔔 เสียงเตือนเปิด" : "🔕 เสียงปิด";
    if(soundOn) beep();
  };
  function beep(){
    if(!actx||!soundOn) return;
    [0,0.18].forEach(t=>{ const o=actx.createOscillator(),g=actx.createGain();
      o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      const s=actx.currentTime+t; g.gain.setValueAtTime(0.001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.16); o.start(s); o.stop(s+0.17); });
  }

  /* slip modal */
  const modal=document.getElementById("slipModal");
  document.getElementById("slipX").onclick=()=>modal.classList.remove("show");
  modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("show"); };
  window._slip=src=>{ document.getElementById("slipImg").src=src; modal.classList.add("show"); };
  window._set=async(id,status)=>{ await updateDoc(doc(db,"orders",id),{status}); };
  window._close=async id=>{ await updateDoc(doc(db,"orders",id),{status:"done",posKeyed:true}); };  // ลง POS แล้ว = ปิดบิล
  window._rej=async id=>{ if(confirm("ปฏิเสธสลิปออเดอร์นี้?")) await updateDoc(doc(db,"orders",id),{status:"rejected"}); };

  function fmtTime(ts){ if(!ts) return ""; const d=ts.toDate(); return d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); }
  function card(id,o,lane){
    const items=o.items.map(i=>`<div class="it"><span class="q">${i.qty}×</span><span>${i.name}${i.optLabel?` <span class="op">(${i.optLabel})</span>`:''}</span></div>`).join("");
    let acts="";
    if(lane==="new") acts=`<button class="b-slip" onclick="_slip('${id}_slip')">🧾</button><button class="b-rej" onclick="_rej('${id}')">✕</button><button class="b-go" onclick="_set('${id}','confirmed')">ยืนยัน → จัด</button>`;
    else if(lane==="cook") acts=`<button class="b-slip" onclick="_slip('${id}_slip')">🧾</button><button class="b-ready" onclick="_set('${id}','ready')">จัดเสร็จ → พร้อมรับ</button>`;
    else if(lane==="ready") acts=`<button class="b-done" onclick="_set('${id}','picked')">ลูกค้ารับแล้ว ✓</button>`;
    else acts=`<button class="b-pos" onclick="_close('${id}')">ลง POS แล้ว → ปิดบิล</button>`;
    return `<div class="o ${lane==='cook'?'cook':lane==='ready'?'ready':lane==='pos'?'pos':''}" data-card="${id}">
      <div class="top"><span class="no">#${o.orderNo||"----"}</span><span class="tm">${fmtTime(o.createdAt)}</span></div>
      ${items}
      <div class="tot"><span>รวม ${o.items.reduce((s,i)=>s+i.qty,0)} ชิ้น</span><span>${baht(o.total)}</span></div>
      <div class="acts">${acts}</div>
    </div>`;
  }

  let first=true; const seen=new Set();
  const slipCache={};
  onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")),snap=>{
    const buckets={new:[],cook:[],ready:[],pos:[]};
    let newArrivals=0;
    snap.forEach(docu=>{
      const o=docu.data(), id=docu.id;
      slipCache[id]=o.slip;
      if(o.status==="new"){ buckets.new.push([id,o]); if(!first && !seen.has(id)) newArrivals++; }
      else if(o.status==="confirmed") buckets.cook.push([id,o]);
      else if(o.status==="ready") buckets.ready.push([id,o]);
      else if(o.status==="picked") buckets.pos.push([id,o]);
      seen.add(id);
    });
    // oldest first within each lane (so FIFO top-down)
    const render=(el,arr,lane)=>{ el.innerHTML = arr.length? arr.reverse().map(([id,o])=>card(id,o,lane)).join("") : '<div class="empty">— ว่าง —</div>'; };
    render(elNew,buckets.new,"new"); render(elCook,buckets.cook,"cook"); render(elReady,buckets.ready,"ready"); render(elPos,buckets.pos,"pos");
    document.getElementById("cNew").textContent=buckets.new.length;
    document.getElementById("cCook").textContent=buckets.cook.length;
    document.getElementById("cReady").textContent=buckets.ready.length;
    document.getElementById("cPos").textContent=buckets.pos.length;
    if(newArrivals>0){ beep(); }
    first=false;
  },err=>{
    document.getElementById("livePill").textContent="● การเชื่อมต่อผิดพลาด";
    document.getElementById("livePill").className="pill";
    alert("อ่านข้อมูลไม่ได้: "+err.message+"\n(ตรวจ Firestore rules ว่าเปิดอ่าน/เขียนสำหรับ pilot)");
  });
  // resolve slip src lazily
  window._slip=key=>{ const id=key.replace(/_slip$/,""); const src=slipCache[id]; if(src){ document.getElementById("slipImg").src=src; modal.classList.add("show"); } else alert("ไม่มีสลิป"); };
}
</script>
</body>
</html>
